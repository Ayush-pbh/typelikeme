      summary: "fn hold/tap dictation verified end-to-end in the installed app, with Wispr-style formatting and a redesigned UI."

checks:
  dirty_fingerprint: unknown
  last_verification:
    result: pass
    task: T005
    commands:
      - "swift build -c release"
      - "./scripts/build-app.sh"
      - "TypeLikeMe --selftest /tmp/tlm_a.wav"
