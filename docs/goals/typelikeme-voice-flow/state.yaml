        - Sources/TypeLikeMe/Dashboard/HomePage.swift
        - Sources/TypeLikeMe/Dashboard/Pages.swift
        - Sources/TypeLikeMe/Core/DictationController.swift
        - Sources/TypeLikeMe/Core/Permissions.swift
        - Sources/TypeLikeMe/main.swift
        - README.md
      commands:
        - cmd: "./scripts/build-app.sh"
          status: pass
        - cmd: "fn dictation into TextEdit, frame captures of ring -> words -> dissolve -> Pasted"
          status: pass
      summary: "Words form from ~3.6k GPU particles, paste lands as they dissolve (~0.5s added, toggleable). Idle 0% CPU / 14 MB; dashboard nebulas pause when occluded; fixed dashboard reopening every launch."
  - id: T999
    type: judge
    assignee: Judge
    status: done
    objective: "Audit whether the full original outcome is complete."
    expected_output:
      - "complete | not_complete"
      - "full_outcome_complete: true | false"
      - "missing evidence"
    receipt:
      result: done
      decision: complete
      full_outcome_complete: true
      missing_evidence:
